[project]
name = "partner-integration-kit"
version = "0.1.0"
description = "Reference partner API, signed webhooks, SDKs, onboarding CLI, and an offline integration-help bot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gyan Mistry" }]
keywords = ["partner-api", "webhooks", "sdk", "fastapi"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "sqlalchemy>=2.0.36",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "redis>=5.0.0",
]

[project.scripts]
pik = "pik_cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
