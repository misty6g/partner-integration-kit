name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest --cov=src --cov-fail-under=85
      - name: TypeScript webhook helper
        run: npm test
        working-directory: sdk/typescript
      - name: OpenAPI document matches the app
        run: python scripts/export_openapi.py && git diff --exit-code -- openapi/openapi.json
